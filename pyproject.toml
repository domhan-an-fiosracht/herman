[project]
name = "herman"
description = "Your friendly neighborhood story helper"
version = "0.1.0"
requires-python = ">= 3.14"
dependencies = [
    "pydantic-settings>=2.14.2",
    "typer>=0.26.7",
    "python-frontmatter>=1.3.0",
]

[project.urls]
repository = "https://github.com/domhan-an-fiosracht/herman"
documentation = "https://fiosracht.world/herman/"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # DX
    "nox>=2026.4.10",
    "prek>=0.4.5",
    # Linters
    "ruff>=0.15.19",
    "mypy>=2.1.0",
    "ty>=0.0.53",
]
docs = [
    "sphinx>=9.1.0",
    # Theme
    "furo>=2025.12.19",
    # Extensions
    "sphinx-autoapi>=3.8.0",
    "releases>=2.1.1",
]
tests = [
    "coverage>=7.14.3",
    "pytest>=9.1.1",
    # Extensions
    "pytest-randomly>=4.1.0",
]

[tool.uv]
# Sync with Dependabot's uv version
required-version = ">=0.10.9"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "TC",      # (flake8-type-checking) - Typer uses runtime type checking
    "UP037",   # (quoted-annotation) - Typer uses runtime type checking
    "B008",    # (Do not perform function call `` in argument defaults) - Typer defaults
    "T201",    # (`print` found) - FIXME
]

[tool.ruff.lint.extend-per-file-ignores]
"docs/*" = [
    "INP001", # (File `docs/conf.py` is part of an implicit namespace package. Add an `__init__.py`.) - Docs are not modules
]
"tests/*" = [
    "S101",   # (Use of `assert` detected) - Yes, that's the point
]

[tool.ruff.lint.isort]
known-first-party = ["herman"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["frontmatter"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source_pkgs = ["herman"]
source_dirs = ["tests"]

[tool.pytest]
strict = true
junit_family = "xunit1" # For Codecov compatibility
